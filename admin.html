<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Správa – Operativní karty</title>
<link rel="icon" href="OPKA_icon.ico">
<script>try { const t = localStorage.getItem('opka_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root {
  --bg: #EEF0F3; --surface: #FFFFFF; --surface-2: #F6F7F9; --ink: #121821; --ink-2: #4A5565; --ink-3: #8A94A3;
  --line: #DCE0E6; --brand: #C62828; --focus: #1F5FBF; --focus-bg: #EAF2FF;
  --ok: #157F3B; --ok-bg: #E8F6EE; --warn: #B54708; --warn-bg: #FFF4E5; --err: #C62828; --err-bg: #FDECEC;
  --c: #C62828; --b: #2E7D32; --r: #D97706; --n: #3949AB; --e: #880E4F;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px -6px rgba(16, 24, 40, .12);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-d: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0E1217; --surface: #171C23; --surface-2: #1E242D; --ink: #E8ECF1; --ink-2: #A9B3C1; --ink-3: #6E7887;
  --line: #2A323D; --brand: #E5484D; --focus: #6EA8FE; --focus-bg: #13233A;
  --ok: #4FD08F; --ok-bg: #11291C; --warn: #FFB648; --warn-bg: #2A1F0E; --err: #FF6B6E; --err-bg: #2C1517;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }

/* lišta */
.top { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.top::before { content: ""; display: block; height: 4px; background: var(--brand); }
.bar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 11px; background: var(--brand); color: #fff; display: grid; place-items: center; }
.logo svg { width: 24px; height: 24px; }
.brand h1 { margin: 0; font-family: var(--font-d); font-size: 19px; font-weight: 750; line-height: 1.1; }
.brand small { display: block; font-size: 13px; color: var(--ink-2); }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.tabs button { height: 40px; padding: 0 16px; border-radius: 11px; font-weight: 650; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs .cnt { font-size: 12px; font-weight: 750; padding: 1px 7px; border-radius: 9px; background: var(--warn-bg); color: var(--warn); }
.grow { flex: 1; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; padding: 6px 12px; border-radius: 10px; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.status.ok { background: var(--ok-bg); color: var(--ok); } .status.warn { background: var(--warn-bg); color: var(--warn); }
.icon-btn { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 19px; height: 19px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.who select, .fld select { height: 40px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; }
.who.need select { border-color: var(--err); box-shadow: 0 0 0 2px var(--err-bg); }
.fld select { background: var(--surface-2); font-weight: 500; width: 100%; }
.date-row { display: flex; gap: 8px; } .date-row input { flex: 1; }
.sprl { list-style: none; margin: 0 0 10px; padding: 0; } .sprl li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); } .sprl li:first-child { border-top: 0; } .sprl li span { flex: 1; font-weight: 600; }
@media (max-width: 1500px) { .brand small { display: none; } .bar { gap: 10px; } .brand h1 { font-size: 17px; } .tabs button { padding: 0 12px; } }
.notice { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 18px; font-size: 14.5px; border-bottom: 1px solid var(--line); }
.notice.warn { background: var(--warn-bg); color: var(--warn); } .notice.err { background: var(--err-bg); color: var(--err); }
.notice b { font-weight: 750; }

/* rozvržení */
.view { display: none; } .view.on { display: grid; }
.split { grid-template-columns: 340px minmax(0, 1fr); gap: 0; height: calc(100vh - 70px); }
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side-top { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
.search svg { width: 17px; height: 17px; color: var(--ink-3); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; }
.side-list { flex: 1; overflow: auto; padding: 6px; }
.it { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 10px; border-radius: 10px; }
.it:hover { background: var(--surface-2); }
.it[aria-current="true"] { background: var(--focus-bg); box-shadow: inset 3px 0 0 var(--focus); }
.it .t { flex: 1; min-width: 0; } .it b { display: block; font-weight: 650; font-size: 15px; line-height: 1.25; } .it .s { display: block; font-size: 12.5px; color: var(--ink-2); }
.it .k { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12.5px; background: var(--kc); flex: none; }
.k-C { --kc: var(--c); } .k-B { --kc: var(--b); } .k-R { --kc: var(--r); } .k-N { --kc: var(--n); } .k-E { --kc: var(--e); }
.flag { font-size: 11.5px; font-weight: 750; padding: 2px 7px; border-radius: 7px; flex: none; }
.flag.new { background: var(--ok-bg); color: var(--ok); } .flag.mod { background: var(--warn-bg); color: var(--warn); } .flag.bad { background: var(--err-bg); color: var(--err); }
.main { overflow: auto; padding: 18px 22px 120px; }
.btn { text-decoration: none; color: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 11px; font-weight: 650; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.brand { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.danger { color: var(--err); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13.5px; border-radius: 9px; }
.btn.full { width: 100%; }
.empty { display: grid; place-items: center; height: 60vh; color: var(--ink-3); text-align: center; }

/* editor */
.ed-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.ed-head h2 { margin: 0; font-family: var(--font-d); font-size: 25px; font-weight: 750; flex: 1; min-width: 200px; }
.saved { font-size: 13px; color: var(--ink-3); }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); max-width: 980px; }
.sec h3 { margin: 0 0 12px; font-size: 13px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row + .row { margin-top: 12px; }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld label { font-size: 13.5px; font-weight: 650; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.fld label .req { color: var(--err); }
.fld label .tool { margin-left: auto; }
.fld input, .fld textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); outline: none; }
.fld input:focus, .fld textarea:focus { border-color: var(--focus); background: var(--surface); }
.fld textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
.fld .hint { font-size: 12.5px; color: var(--ink-3); }
.fld.bad input, .fld.bad .seg { border-color: var(--err); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg.kat button[aria-pressed="true"] { background: var(--kc); border-color: var(--kc); color: #fff; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.ltag { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 4px; border-radius: 11px; border: 1.5px solid var(--kc); background: var(--surface); font-weight: 650; }
.ltag .k { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; background: var(--kc); }
.ltag .x { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
.ltag .x:hover { background: var(--err-bg); color: var(--err); }
.picker { position: relative; margin-top: 10px; max-width: 520px; }
.picker .search { background: var(--surface); }
.drop { position: absolute; left: 0; right: 0; top: 46px; z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.3); max-height: 300px; overflow: auto; padding: 6px; }
.maps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.map { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.map .img { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--surface-2); position: relative; }
.map img { width: 100%; height: 100%; object-fit: cover; display: block; }
.map .miss { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 12.5px; color: var(--err); padding: 8px; font-weight: 650; }
.map .bar2 { display: flex; align-items: center; gap: 4px; padding: 6px; }
.map .n { flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map .bar2 button { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.map .bar2 button:hover { background: var(--line); }
.map .bar2 svg { width: 15px; height: 15px; }
.add-map { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.add-map input[type=text] { flex: 1; min-width: 180px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.pik { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.pk { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); text-align: center; font-size: 11.5px; line-height: 1.2; color: var(--ink-2); }
.pk img { width: 52px; height: 52px; object-fit: contain; background: #fff; border-radius: 8px; padding: 2px; }
.pk[aria-pressed="true"] { border-color: var(--focus); background: var(--focus-bg); color: var(--ink); box-shadow: 0 0 0 2px var(--focus); }
.subh { font-size: 12.5px; font-weight: 750; color: var(--ink-3); margin: 12px 0 8px; }
.subh:first-child { margin-top: 0; }

/* publikovat */
.pub { padding: 22px; display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; max-width: 1300px; }
.pub .sec { margin: 0; max-width: none; }
.pub .wide { grid-column: 1 / -1; }
.chg { list-style: none; margin: 0; padding: 0; font-size: 14.5px; }
.chg li { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.chg li:first-child { border-top: 0; }
.steps { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; }
.steps li { margin: 3px 0; }
.ver { display: flex; gap: 10px; align-items: baseline; margin: 6px 0 12px; }
.ver b { font-family: var(--font-d); font-size: 32px; }
.pub-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.pub-note { margin: 10px 0 0; font-size: 13.5px; color: var(--ink-3); line-height: 1.5; }
.pub-note b { color: var(--ink-2); }
.gh-in { flex: 1; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.log { max-height: 320px; overflow: auto; font-size: 13.5px; }
.log div { padding: 6px 0; border-top: 1px solid var(--line); } .log div:first-child { border-top: 0; }
.log .c { color: var(--ink-3); font-size: 12px; }
.prob li { color: var(--err); }

/* náhled */
.dlg { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 12, 18, .55); }
.dlg.on { display: flex; }
.dlg-box { width: min(900px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--bg); border-radius: 18px; }
.dlg-top { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.pv { padding: 16px; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pv h2 { grid-column: 1 / -1; margin: 0; font-family: var(--font-d); }
.pv .f { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.pv .f.w { grid-column: 1 / -1; } .pv .f.r { background: var(--warn-bg); border-color: var(--warn); }
.pv .l { font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
.toast { position: fixed; left: 50%; bottom: 22px; z-index: 100; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 11px 18px; border-radius: 12px; background: var(--ink); color: var(--surface); font-weight: 650; transition: opacity .2s, transform .25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--err); color: #fff; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; height: auto; } .side { max-height: 40vh; } .row, .pub { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/><path d="M12 8v4M10 10h4"/></svg></div><div><h1>Operativní karty · správa</h1><small>úpravy dat pro aplikaci</small></div></div>
    <nav class="tabs" role="tablist">
      <button type="button" data-tab="obj" aria-selected="true">Objekty</button>
      <button type="button" data-tab="cb" aria-selected="false">CBRNE látky</button>
      <button type="button" data-tab="pub" aria-selected="false">Publikovat <span class="cnt" id="tab-cnt" hidden></span></button>
    </nav>
    <span class="grow"></span>
    <label class="who" id="who-w">Správce <select id="who" aria-label="Kdo upravuje"></select></label>
    <span class="status ok" id="status"><span class="dot"></span><span id="status-t">Beze změn</span></span>
    <a class="btn" href="index.html" target="_blank" rel="noopener">Otevřít aplikaci</a>
    <button type="button" class="icon-btn" id="b-theme" title="Světlý / tmavý režim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </div>
  <div class="notice" id="notice" hidden></div>
</header>

<section class="view split on" id="v-obj">
  <aside class="side">
    <div class="side-top">
      <button type="button" class="btn brand full" id="new-obj">+ Nový objekt</button>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q-obj" type="search" placeholder="Hledat objekt…"></label>
    </div>
    <div class="side-list" id="l-obj"></div>
  </aside>
  <div class="main" id="e-obj"></div>
</section>

<section class="view split" id="v-cb">
  <aside class="side">
    <div class="side-top">
      <button type="button" class="btn brand full" id="new-cb">+ Nová látka</button>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q-cb" type="search" placeholder="Hledat látku…"></label>
    </div>
    <div class="side-list" id="l-cb"></div>
  </aside>
  <div class="main" id="e-cb"></div>
</section>

<section class="view" id="v-pub"><div class="pub" id="pub"></div></section>

<div class="dlg" id="dlg"><div class="dlg-box"><div class="dlg-top"><b class="grow">Náhled karty v aplikaci</b><button type="button" class="btn pri" id="dlg-x">Zavřít</button></div><div id="dlg-b"></div></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="cbrne.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const br2nl = (s) => String(s ?? '').replace(/\s*<br\s*\/?>\s*/gi, '\n');
const rich = (h) => { const s = String(h ?? '').trim(); if (!s) return '<span style="color:var(--ink-3)">–</span>'; return /<[a-z]/i.test(s) ? s.replace(/\s*\n\s*/g, '<br>') : esc(s).replace(/\n/g, '<br>'); };
const clone = (x) => JSON.parse(JSON.stringify(x));
const uid = () => '_' + Math.random().toString(36).slice(2, 10);
const now = () => new Date().toLocaleString('cs-CZ');
const OKRESY = ['Děčín', 'Chomutov', 'Litoměřice', 'Louny', 'Most', 'Teplice', 'Ústí n. L.'];
const KAT = { C: 'C - Chemické', B: 'B - Biologické', R: 'R - Radiologické', N: 'N - Nukleární', E: 'E - Výbušniny' };
const katOf = (l) => (l.kategorie || 'C').trim().charAt(0).toUpperCase();
const PIK = [
  ['ghs01_explosive.png', 'Výbušné'], ['ghs02_flammable.png', 'Hořlavé'], ['ghs03_oxidizing.png', 'Oxidující'], ['ghs04_compressed.png', 'Plyn pod tlakem'], ['ghs05_corrosive.png', 'Žíravé'],
  ['ghs06_toxic.png', 'Toxické'], ['ghs07_harmful.png', 'Dráždivé'], ['ghs08_health.png', 'Nebezp. pro zdraví'], ['ghs09_environment.png', 'Živ. prostředí'],
  ['sym_radioactive.png', 'Ionizující záření'], ['sym_biohazard.png', 'Biologické riziko'], ['sym_toxic.png', 'Toxická látka'], ['sym_corrosive.png', 'Žíravina'], ['sym_flammable.png', 'Hořlavá látka'],
  ['sym_explosive.png', 'Výbušná látka'], ['sym_high_voltage.png', 'Vysoké napětí'], ['sym_cryogenic.png', 'Kryogenní'], ['sym_laser.png', 'Laser'], ['sym_magnetic.png', 'Magnetické pole'], ['sym_non_ionizing.png', 'Neionizující záření'],
];
const PIK_OLD = { 'compressed_gas.jpg': 'ghs04_compressed.png', 'corrosive.jpg': 'ghs05_corrosive.png', 'toxic.jpg': 'ghs06_toxic.png', 'oxidizing.jpg': 'ghs03_oxidizing.png', 'ziravina.jpg': 'ghs05_corrosive.png', 'biohazard.jpg': 'sym_biohazard.png', 'radioactive.jpg': 'sym_radioactive.png', 'explosive.jpg': 'ghs01_explosive.png', 'harmful.jpg': 'ghs07_harmful.png' };
const IC = {

  const fC = new Map(FILE_C.map((l) => [l.id || slug(l.nazev), JSON.stringify({ ...l, piktogramy: [...new Set((l.piktogramy || []).map((p) => PIK_OLD[p] || p))] })]));
  const dC = new Map(C.map((l) => [l.id, strip(l)]));
  const res = { fAdd: [], fMod: [], fDel: [], cAdd: [], cMod: [], cDel: [] };
  dF.forEach((v, k) => { if (!fF.has(k)) res.fAdd.push(k); else if (fF.get(k) !== v) res.fMod.push(k); });
  fF.forEach((v, k) => { if (!dF.has(k)) res.fDel.push(k); });

/* ---------- GitHub (převzato z ResqHubu) ----------
   Připojení (uživatel, repozitář, větev, složka, token) je v tomto počítači uložené
   zašifrované heslem. Klíč existuje jen v paměti, dokud je připojení odemčené. */

const vault = { key: null, salt: null, get locked() { return !this.key && !!storedVault(); } };
const PEND = {};   // obrázky vybrané v tomto sezení: název → { file, url }
const IC_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>';
const IC_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>';

const u8 = (b64) => { const b = atob(b64), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };

  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 300000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

  if (!vault.key) return;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, vault.key, new TextEncoder().encode(JSON.stringify(gh))));
  try { localStorage.setItem(VAULT_KEY, JSON.stringify({ v: 1, salt: bytesToB64(vault.salt), iv: bytesToB64(iv), data: bytesToB64(data) })); } catch (e) {}
}
function ghAutofill() {   // na GitHub Pages se uživatel, repozitář a složka doplní sami
  const host = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!host || gh.owner) return;
  const seg = location.pathname.split('/').filter(Boolean);
  if (seg.length && /\.html?$/i.test(seg[seg.length - 1])) seg.pop();
  gh.owner = host[1];
  if (seg.length && host[1].toLowerCase() + '.github.io' !== seg[0].toLowerCase()) { gh.repo = seg.shift(); } else gh.repo = host[1] + '.github.io';

const ghWhere = () => `${gh.owner}/${gh.repo}` + (gh.folder ? '/' + gh.folder.replace(/^\/+|\/+$/g, '') : '') + ` (${gh.branch || 'main'})`;

function ghError(st) {

  if (st === 404) return 'Repozitář, větev nebo složka nenalezena – zkontroluj údaje a přístup tokenu.';

async function ghGetText(p) {   // obsah souboru, nebo null když neexistuje
  const r = await fetch(ghUrl(p) + ref(), { headers: ghHeaders(true), cache: 'no-store' });

function metaOf(txt) { try { const g = {}; new Function('g', String(txt).replace(/^const (OPKA_META|OPKA_SPRAVCI|firmy|cbrneData)\b/gm, 'g.$1'))(g); return g.OPKA_META || { verze: 0 }; } catch (e) { return { verze: 0 }; } }

function ghSection() {
  const f = (k, l, ph, extra = '') => `<div class="fld"><label for="gh-${k}">${l}</label><input id="gh-${k}" data-gh="${k}" value="${esc(gh[k] || '')}" placeholder="${ph}" autocapitalize="off" autocorrect="off" spellcheck="false" ${extra}></div>`;
  const fields = `<div class="row">${f('owner', 'Uživatel', 'github-jmeno')}${f('repo', 'Repozitář', 'opka')}</div>
    <div class="row">${f('branch', 'Větev', 'main')}${f('folder', 'Složka', 'kořen repozitáře')}</div>
    <div class="row">${f('token', 'Token', 'github_pat_…', 'type="password" autocomplete="off"').replace('class="fld"', 'class="fld wide"')}</div>`;
  const help = '<p class="pub-note">Token vytvoříš na GitHubu v <b>Settings › Developer settings › Fine-grained tokens</b>. Povol jen tento repozitář a oprávnění <b>Contents: Read and write</b>. Připojení zůstává uložené jen v tomto počítači, zašifrované heslem.</p>';
  if (vault.locked) return `<div class="sec"><h3>Připojení ke GitHubu <span class="flag mod">zamčeno</span></h3>
    <p style="margin:0 0 10px;color:var(--ink-2);font-size:14px">Připojení je v tomto počítači uložené. Odemkni ho heslem.</p>
    <div class="date-row"><input id="gh-pw" type="password" placeholder="heslo k připojení" autocomplete="current-password" class="gh-in"><button type="button" class="btn pri" id="gh-unlock">Odemknout</button></div>
    <button type="button" class="btn sm danger" id="gh-forget" style="margin-top:12px">Zapomenout připojení</button></div>`;
  if (!vault.key) return `<div class="sec"><h3>Připojení ke GitHubu</h3>${fields}
    <div class="row"><div class="fld"><label for="gh-pw">Heslo k připojení</label><input id="gh-pw" type="password" autocomplete="new-password" placeholder="aspoň 8 znaků"></div><div class="fld"><label for="gh-pw2">Heslo znovu</label><input id="gh-pw2" type="password" autocomplete="new-password"></div></div>
    <div class="pub-btns"><button type="button" class="btn pri" id="gh-save">Uložit a ověřit</button></div>${help}</div>`;
  return `<div class="sec"><h3>Připojení ke GitHubu <span class="flag new">odemčeno</span></h3>${fields}
    <div class="pub-btns"><button type="button" class="btn" id="gh-test">Ověřit připojení</button><button type="button" class="btn" id="gh-load">Načíst data z GitHubu</button><button type="button" class="btn" id="gh-lock">Zamknout</button></div>${help}</div>`;
}

async function ghTest(quiet) {
  if (!(gh.owner && gh.repo && gh.token)) { toast('Vyplň uživatele, repozitář a token', true); return false; }
  try {
    const r = await fetch('https://api.github.com/repos/' + encodeURIComponent(gh.owner) + '/' + encodeURIComponent(gh.repo), { headers: ghHeaders(), cache: 'no-store' });
    if (!r.ok) throw new Error(ghError(r.status));
    const j = await r.json();
    if (j.permissions && !j.permissions.push) throw new Error('Token má jen čtení, chybí zápis.');
    const d = await ghGetText('data.js');
    if (!quiet) toast(`Připojeno k ${j.full_name} ✓` + (d === null ? ' – data.js ve složce zatím není' : ` – na GitHubu je verze ${metaOf(d).verze}`), d === null);
    return true;
  } catch (e) { toast(e.message || 'Nepodařilo se připojit', true); return false; }
}

async function ghLoad(ask = true) {
  if (ask && diff().n && !confirm('Načíst data z GitHubu do editoru?\n\nTvoje nepublikované změny se nejdřív stáhnou jako záloha (soubory …-zaloha.js) a pak se nahradí verzí z GitHubu.')) return;
  try {
    const [d, c] = await Promise.all([ghGetText('data.js'), ghGetText('cbrne.js')]);
    if (d === null && c === null) { toast('Na GitHubu zatím žádná data nejsou', true); return; }
    if (diff().n) { const o = buildFiles({ verze: base, datum: now(), spravce: spravce() + ' (záloha)' }); dl('data-zaloha.js', o.data); setTimeout(() => dl('cbrne-zaloha.js', o.cbrne), 400); }
    if (d !== null) loadText(d); if (c !== null) loadText(c);
    prep(); curF = curC = null; changed(); renderAll(); renderPub();
    logIt(`Načtena verze ${base} z GitHubu`); toast(`Načtena verze ${base} z GitHubu`);
  } catch (e) { toast(e.message || 'Načtení selhalo', true); }
}

async function ghPublish() {
  const sp = spravce(); if (!sp) { toast('Nahoře vyber, kdo publikuje', true); $('who').focus(); return; }
  if (!ghReady()) return;
  const btn = $('gh-pub'), lab = (t) => { btn.innerHTML = IC_UP + esc(t); };
  btn.disabled = true; $('export').disabled = true;
  try {
    lab('Kontroluji verzi na GitHubu…');
    const remote = await ghGetText('data.js'), rm = remote === null ? { verze: 0 } : metaOf(remote);
    if ((rm.verze || 0) > base) {
      if (confirm(`Na GitHubu je už novější verze ${rm.verze}` + (rm.spravce ? ` (${rm.spravce}, ${rm.datum || ''})` : '') + `.\nTvoje změny vycházejí z verze ${base} – publikováním bys jeho změny přepsal.\n\nOK = stáhnout tvoje změny jako zálohu a načíst verzi ${rm.verze} z GitHubu. Pak změny zopakuj.\nZrušit = nic nedělat.`)) await ghLoad(false);
      return;
    }
    lab('Kontroluji obrázky…');
    const refs = [...new Set(F.flatMap((f) => [].concat(f.mapa || []).filter(Boolean)))];
    const have = refs.length ? await ghList('mapy') : new Set();
    const missing = refs.filter((n) => !have.has(n)), up = missing.filter((n) => PEND[n]), lost = missing.filter((n) => !PEND[n]);
    if (lost.length && !confirm(`Tyto obrázky nejsou na GitHubu ve složce mapy/ a v tomto počítači nejsou vybrané:\n\n• ${lost.join('\n• ')}\n\nV aplikaci se nezobrazí. Publikovat i tak?\n(Obrázek přidáš znovu přes „Vybrat soubory…“ u objektu.)`)) return;
    const meta = { verze: base + 1, datum: now(), spravce: sp }, out = buildFiles(meta), total = up.length + 2; let i = 0;
    for (const n of up) { lab(`Nahrávám ${++i}/${total} – ${n}`); await ghPut('mapy/' + n, bytesToB64(new Uint8Array(await PEND[n].file.arrayBuffer())), `OPKA: plánek ${n} (${sp})`); }
    lab(`Nahrávám ${++i}/${total} – cbrne.js`); await ghPut('cbrne.js', textToB64(out.cbrne), `OPKA data v${meta.verze} – CBRNE (${sp})`);
    lab(`Nahrávám ${++i}/${total} – data.js`); await ghPut('data.js', textToB64(out.data), `OPKA data v${meta.verze} (${sp})`);
    base = meta.verze; exported = true; via = 'gh'; saveDraft();
    logIt(`Publikováno na GitHub: verze ${meta.verze}` + (up.length ? `, obrázky: ${up.join(', ')}` : ''));
    renderStatus(); toast(`Verze ${meta.verze} publikována ✓ GitHub Pages ji nasadí do pár minut`);
  } catch (e) { toast(e.message || 'Publikování selhalo', true); }
  finally { renderPub(); }
}

function ghClick(e) {
  const t = e.target;
  if (t.closest('#gh-save')) {
    (async () => {
      const pw = $('gh-pw').value;
      if (!window.crypto || !crypto.subtle) return toast('Šifrování potřebuje zabezpečenou adresu (https)', true);
      if (pw.length < 8) return toast('Heslo musí mít aspoň 8 znaků', true);
      if (pw !== $('gh-pw2').value) return toast('Hesla se neshodují', true);
      vault.salt = crypto.getRandomValues(new Uint8Array(16)); vault.key = await deriveKey(pw, vault.salt);
      await sealVault(); renderPub(); ghTest();
    })(); return true;
  }
  if (t.closest('#gh-unlock')) {
    (async () => {
      const st = storedVault(), b = $('gh-unlock'); b.disabled = true; b.textContent = 'Odemykám…';
      try {
        const salt = u8(st.salt), key = await deriveKey($('gh-pw').value, salt);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(st.iv) }, key, u8(st.data));
        gh = { ...EMPTY_GH, ...JSON.parse(new TextDecoder().decode(plain)) }; vault.key = key; vault.salt = salt;
        renderPub(); toast('Připojení odemčeno');
      } catch (er) { b.disabled = false; b.textContent = 'Odemknout'; toast('Špatné heslo', true); $('gh-pw').select(); }
    })(); return true;
  }
  if (t.closest('#gh-forget')) { if (!confirm('Smazat uložené připojení ke GitHubu včetně tokenu z tohoto počítače? Data ani koncept se nezmění.')) return true; try { localStorage.removeItem(VAULT_KEY); } catch (er) {} gh = { ...EMPTY_GH }; ghAutofill(); renderPub(); return true; }
  if (t.closest('#gh-lock')) { clearTimeout(sealT); sealVault().then(() => { vault.key = null; vault.salt = null; gh = { ...EMPTY_GH }; renderPub(); }); return true; }
  if (t.closest('#gh-test')) { ghTest(); return true; }
  if (t.closest('#gh-load')) { ghLoad(); return true; }
  return false;
}
$('pub').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'gh-pw') { e.preventDefault(); ($('gh-unlock') || $('gh-save')).click(); } });
ghAutofill();

/* ---------- ostatní ---------- */
let toastT = null;
function toast(t, err) { const el = $('toast'); el.textContent = t; el.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => el.className = 'toast', 2600); }
$('who').onchange = (e) => { const v = e.target.value; if (v === '__edit') { renderWho(); setTab('pub'); setTimeout(() => $('spr-new') && $('spr-new').focus(), 50); return; } try { localStorage.setItem('opka_spravce', v); } catch (er) {} renderWho(); if (tab === 'pub') renderPub(); };
$('b-theme').onclick = () => { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = d; try { localStorage.setItem('opka_theme', d); } catch (e) {} };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('dlg').classList.remove('on'); });
function renderWho() {
  const cur = spravce(), w = $('who');
  w.innerHTML = `<option value="">— vyber —</option>` + S.map((n) => `<option ${n === cur ? 'selected' : ''}>${esc(n)}</option>`).join('') + (cur && !S.includes(cur) ? `<option selected>${esc(cur)}</option>` : '') + '<option value="__edit">Upravit seznam…</option>';
  $('who-w').classList.toggle('need', !cur);
}
function renderAll() { renderWho(); renderFList(); renderFEd(); renderCList(); renderCEd(); renderStatus(); }

/* ---------- start ---------- */
(function start() {
  let d = null; try { d = JSON.parse(localStorage.getItem('opka_draft2') || 'null'); } catch (e) {}
  if (d && d.exported && (FILE_META.verze || 0) >= d.base) { localStorage.removeItem('opka_draft2'); d = null; }   // export už je na serveru
  if (d) {
    F = d.F; C = d.C; S = d.S || clone(FILE_S); base = d.base; exported = !!d.exported; via = d.via || ''; prep();
    const n = $('notice');
    if (!d.exported && (FILE_META.verze || 0) > d.base) { n.className = 'notice err'; n.innerHTML = `<span><b>Pozor:</b> rozpracované změny z ${esc(d.cas)} vychází z verze ${d.base}, ale na serveru je už verze ${FILE_META.verze}. Při publikování bys přepsal novější data.</span> <button type="button" class="btn sm" id="n-discard">Zahodit a načíst verzi ${FILE_META.verze}</button>`; }
    else if (d.exported && d.via === 'gh') { n.className = 'notice warn'; n.innerHTML = `<span><b>Verze ${d.base} je odeslaná na GitHub</b>, ale stránka ještě načítá verzi ${FILE_META.verze || 0}. Nasazení trvá 1–3 minuty, pak obnov stránku.</span>`; }
    else if (d.exported) { n.className = 'notice warn'; n.innerHTML = `<span><b>Export verze ${d.base} ještě není na serveru</b> (soubory mají verzi ${FILE_META.verze || 0}). Nahraj stažené soubory.</span>`; }
    else { n.className = 'notice warn'; n.innerHTML = `Pokračuješ v rozpracovaných změnách z ${esc(d.cas)}. <button type="button" class="btn sm" id="n-discard">Zahodit a začít ze souborů</button>`; }
    n.hidden = false;
  } else fromFiles();
  renderAll();
})();
$('notice').addEventListener('click', (e) => { if (e.target.closest('#n-discard')) { if (!confirm('Zahodit rozpracované změny?')) return; localStorage.removeItem('opka_draft2'); fromFiles(); curF = curC = null; renderAll(); $('notice').hidden = true; } });
</script>
</body>
